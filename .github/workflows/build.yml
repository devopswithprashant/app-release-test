name: Build

on:
  push:
  pull_request:


permissions:
  contents: read
  id-token: write # <--- REQUIRED for OIDC


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false


env:
  GIT_USER_NAME: "ci-bot"
  GIT_USER_EMAIL: "ci-bot@example.com"


jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
    # Checkout the repository to the GitHub Actions runner
    - name: Checkout
      uses: actions/checkout@v4

    - name: Linting
      run: echo "running linting.."
  
  build:
    needs: [lint]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
    # Checkout the repository to the GitHub Actions runner
    - name: Checkout
      uses: actions/checkout@v4

    - name: Build
      run: echo "running build"
  
  publish:
    needs: [build]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
    # Checkout the repository to the GitHub Actions runner
    - name: Checkout
      uses: actions/checkout@v4

    - name: Publish
      run: echo "running publish"
  
  deploy-DEV:
    needs: [publish]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
    # Checkout the repository to the GitHub Actions runner
      - name: Checkout gitops repo
        uses: actions/checkout@v4
        with:
          repository: "devopswithprashant/gitops-test"
          token: ${{ secrets.GHEC_TOKEN_K8 }}
          ref: feat-1.1.0
          fetch-depth: 10

      - name: Update image tag in target file
        #working-directory: gitops
        id: update
        run: |
          set -euo pipefail
          FILE="apps/blog/dev/deploy.yaml"
          IMAGE="850756192530.dkr.ecr.us-east-1.amazonaws.com/devopswithprashant/testing"
          NEW_TAG=v0.1.0
          if [ ! -f "$FILE" ]; then
            echo "ERROR target file not found: $FILE"
            exit 1
          fi
          sed -i -E "s|(image:\s*850756192530\.dkr\.ecr\.us-east-1\.amazonaws\.com/devopswithprashant/testing:)[^[:space:]]+|\1${NEW_TAG}|" "$FILE"
          # Git config
          git config user.name "${GIT_USER_NAME}"
          git config user.email "${GIT_USER_EMAIL}"
          git add "$FILE"
          git commit -m "chore(DEV): bump blog image to ${IMAGE} version ${NEW_TAG}"
          git push origin feat-1.1.0

      
  
  deploy-QA:
    needs: [deploy-DEV]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
    # Checkout the repository to the GitHub Actions runner
      - name: Checkout gitops repo
        uses: actions/checkout@v4
        with:
          repository: "devopswithprashant/gitops-test"
          token: ${{ secrets.GHEC_TOKEN_K8 }}
          ref: feat-1.1.0
          fetch-depth: 10

      - name: Update image tag in target file
        #working-directory: gitops
        id: update
        run: |
          set -euo pipefail
          FILE="apps/blog/qa/deploy.yaml"
          IMAGE="850756192530.dkr.ecr.us-east-1.amazonaws.com/devopswithprashant/testing"
          NEW_TAG=v0.1.0
          if [ ! -f "$FILE" ]; then
            echo "ERROR target file not found: $FILE"
            exit 1
          fi
          sed -i -E "s|(image:\s*850756192530\.dkr\.ecr\.us-east-1\.amazonaws\.com/devopswithprashant/testing:)[^[:space:]]+|\1${NEW_TAG}|" "$FILE"
          # Git config
          git config user.name "${GIT_USER_NAME}"
          git config user.email "${GIT_USER_EMAIL}"
          git add "$FILE"
          git commit -m "chore(DEV): bump blog image to ${IMAGE} version ${NEW_TAG}"
          git push origin feat-1.1.0

  

    
    
