    steps:
    # Checkout the repository to the GitHub Actions runner
      - name: Checkout gitops repo
        uses: actions/checkout@v4
        with:
          repository: "devopswithprashant/gitops-test"
          token: ${{ secrets.GHEC_TOKEN_K8 }}
          ref: feat-1.1.0
          fetch-depth: 10

      - name: Install yq (mikefarah)
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Update image tag in target file
        #working-directory: gitops
        id: update
        run: |
          set -euo pipefail
          FILE="apps/blog/dev/deploy.yaml"
          IMAGE="850756192530.dkr.ecr.us-east-1.amazonaws.com/devopswithprashant/testing:v2.1.0"
          echo "Updating file: $FILE -> image: $IMAGE"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: target file not found: $FILE"
            exit 1
          fi

          # Basic yq expression: replace container[0].image — adjust path if your manifest differs
          # This will update the first container's image in the Deployment manifest.
          # yq eval -i '.spec.template.spec.containers[0].image = env(IMAGE)' "$FILE"
          yq eval -i '.spec.template.spec.containers[0].image = $IMAGE' "$FILE"

          # show diff for visibility
          # git --no-pager diff -- "$FILE" || true

          # Git config
          git config user.name "${GIT_USER_NAME}"
          git config user.email "${GIT_USER_EMAIL}"

          git add "$FILE"
          git commit -m "chore(DEV): bump blog image to ${IMAGE}"
          git push origin feat-1.1.0

